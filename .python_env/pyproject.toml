[project]
name = "rl-playground"
version = "0.1.0"
description = "Reinforcement-learning playground for PyTorch and Gymnasium"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gym==0.26.2",
  "gym-maze",
  "gymnasium[classic-control]>=1.2.0,<2",
  "ipykernel>=7.0.0,<8",
  "jupyterlab>=4.4.0,<5",
  "kaleido>=1.0.0,<2",
  "matplotlib>=3.9.0,<4",
  "numpy>=2.0.0,<3",
  "opencv-python-headless>=4.10.0.0,<5",
  "plotly>=6.0.0,<7",
  "torch>=2.6.0,<3",
  "torchvision>=0.21.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9",
  "ruff>=0.12.0,<1",
]

[tool.uv]
package = false

# Linux containers cannot use Apple's Metal GPU. Keep their PyTorch wheel CPU-only
# instead of pulling several gigabytes of unused CUDA libraries. On macOS uv falls
# back to PyPI, whose native wheel includes the MPS backend.
[tool.uv.sources]
gym-maze = { git = "https://github.com/MattChanTK/gym-maze.git", rev = "83176811b49b5538a6213520612f44fb1bc49114" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The host-side manager intentionally remains compatible with Python 3.9.
"c" = ["UP045"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
