[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:sshd]
command=/usr/sbin/sshd -D -e -f /etc/ssh/sshd_config
priority=10
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:jupyter]
command=/usr/local/bin/start-jupyter
directory=/workspace
user=developer
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=HOME="/home/developer",USER="developer",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/workspace"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:app]
command=/usr/local/bin/start-app
directory=/workspace
user=developer
priority=30
autostart=true
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
environment=HOME="/home/developer",USER="developer",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/workspace"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
